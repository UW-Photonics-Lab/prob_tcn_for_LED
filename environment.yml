# Rerun after changes: conda env update --file environment.yml --prune

name: prob_tcn_for_LED
variables:
  KMP_DUPLICATE_LIB_OK: "TRUE"
channels:
  - conda-forge
  - defaults
dependencies:
  - pip>=23
  - python=3.11
  - numpy>=1.26,<2
  - matplotlib>=3.8
  - pandas>=2.0
  - scikit-learn
  - zarr
  - pyyaml
  - tqdm
  - scipy
  - wandb
  - seaborn
  - pyserial
  - ipykernel
  - pytest
  - pip:
      - torch==2.4.1
      - torchaudio==2.4.1
      - pyvisa
      - pyflux @ git+https://github.com/UW-Photonics-Lab/PyFlux.git@578f3027be51c481d9bf4ca29d76f05d291f319d
      - -e .   # this repo, editable: makes `import modules` resolve from any cwd