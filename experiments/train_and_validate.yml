HARDWARE_RESOURCES:
    Agilent_33250A:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: Agilent Technologies,33250A,0,1.03-1.01-1.00-03-1
    Tektronix_TDS2000:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: TEKTRONIX,TBS2074,C020561,CF:91.1CT FV:v1.26.0; FPGA:v1.21;
    HP_EE3631A:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: HEWLETT-PACKARD,E3631A,0,2.1-5.0-1.0
DATA_COLLECTION: 
  N: 10000 # Number of datapoints collected at the DC offset
  DC_OFFSETS: [0.050] # A (single offset per dataset)
  F_MINS: [1.0e+6] # Hz
  F_MAXS: [7.6e+6] # Hz Here are the max freqs used in order of DC offset [7.6e6, 9.2e6, 10.8e6, 13e6]
  OSC_SAMPLE_RATES: [500e6] # Hz
  SUBCARRIER_SPACING: 100e3 # Hz
  UPSAMPLE_FACTOR: 4
  AWG_TABLE_FRACTION: 0.125
  CP_LENGTH_FRACTION: 0.25
  PREAMBLE_LENGTH: 256
  MODULATION_FORMAT: "m7_apsk_constellation"
  OSC_SCALE: 0.5 # V/div
  POWER_MIN: 0.1  # minimum symbol power
  POWER_MAX: 1.5  # maximum symbol power
  JITTER_POWER: 0 # off-constellation complex noise on symbols (collection only); 0 disables
  DATASET_PATH: /home/photonicslab/Desktop/microled_project/prob_tcn_for_LED/data/sweeps/prime_coast_dc0.05A_fmin1e+06_fmax7.6e+06_20260724_2101.zarr
  CLIP_THRESHOLD: 3.0 # clip the AWG output to +/-this value (V)

CHANNEL_GRID_SEARCH:
  VAL_FRACTION: 0.1
  EVAL_CHUNK_SIZE: 512  # bursts per forward pass during evaluation
  SELECTION_MODE: best_per_size  # "best" or "best_per_size" or "all"
  PROB_SELECTION_KEY: val_per_burst_rrmse_pct  # for probabilistic models, the metric used to select the best run
                            
  models:
    - model: tcn            # base 3: 4 layers, k8, RF=281 (nonprob)
      params:
        nlayers: [4]
        hidden_channels: [6, 8, 12, 16, 22]
        kernel_size: [8]
        dilation_base: 3
        weight_norm: [true]
        activation: [gelu]
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5 # Learning rate scheduler
        patience: 25
        min_lr: 1.0e-6
        distribution: ["none"]

    - model: tcn            # base 3: 4 layers, k8, RF=281 (Gaussian)
      params:
        nlayers: [4]
        hidden_channels: [6, 8, 12, 16, 22]
        kernel_size: [8]
        dilation_base: 3
        weight_norm: [true]
        activation: [gelu]
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5 # Learning rate scheduler
        patience: 25
        min_lr: 1.0e-6
        distribution: ["gaussian"]
        beta_nll: [1]

    - model: lru   # Linear Recurrent Unit
      params:
        state_dim: [16]      # linear state-space size (memory capacity)
        hidden_dim: [6, 10, 16, 25, 40]     # per-timestep feature width
        n_layers: 2
        dropout: 0.1
        r_min: 0.0               # eigenvalue-radius init range; r_max -> 1 allows long memory
        r_max: 1.0
        max_phase: 6.28          # init phase spread (2*pi) of the state eigenvalues
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5 # Learning rate scheduler
        patience: 25
        min_lr: 1.0e-6
        distribution: ["none"]

    - model: lru
      params:
        state_dim: [16]      # linear state-space size (memory capacity)
        hidden_dim: [6, 10, 16, 25, 40]     # per-timestep feature width
        n_layers: 2
        dropout: 0.1
        r_min: 0.0
        r_max: 1.0
        max_phase: 6.28
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5
        patience: 25
        min_lr: 1.0e-6
        distribution: ["gaussian"]
        beta_nll: [1]

    - model: gmp            # generalized memory polynomial, closed-form
      params:
        memory_linear: [281]
        memory_nonlinear: [281]
        nonlinearity_order: [4]
        cross_term_depth: [0, 1, 2, 3, 7]
        ridge: 1.0e-3

    - model: lstm           # RF=1 (nonprob)
      params:
        hidden_dim: [7, 11, 15, 22, 31]
        n_layers: 2
        dropout: 0.1
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5 # Learning rate scheduler
        patience: 25
        min_lr: 1.0e-6
        distribution: ["none"]

    - model: lstm           # RF=1 (Gaussian)
      params:
        hidden_dim: [7, 11, 15, 22, 31]
        n_layers: 2
        dropout: 0.1
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5
        patience: 25
        min_lr: 1.0e-6
        distribution: ["gaussian"]
        beta_nll: [1]

    - model: tthnet         # window matched to TCN base-3 RF=281 (nonprob)
      params:
        window: [281]
        hidden1: [2, 4, 7, 14, 29]
        hidden2: [4]
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5 # Learning rate scheduler
        patience: 25
        min_lr: 1.0e-6
        distribution: ["none"]

    - model: tthnet         # window matched to TCN base-3 RF=281 (Gaussian)
      params:
        window: [281]
        hidden1: [2, 4, 7, 14, 29]
        hidden2: [4]
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5
        patience: 25
        min_lr: 1.0e-6
        distribution: ["gaussian"]
        beta_nll: [1]

ENCODER_DECODER:
  CONSTELLATION: qpsk
  PREAMBLE_AMPLITUDE: 3.0     # encoder output is clamped to +-this
  RUNS_PER_ARCH: 10
  EVAL_CHUNK_SIZE: 512  # bursts per forward pass when a reloaded channel model is evaluated
  params:
    nlayers: [2]
    dilation_base: [2]
    kernel_size: [16]
    hidden_channels: [16]
    activation: [relu]
    epochs: 1500
    noise_anneal_start: [0.50]   # fraction of epochs at full channel noise before a linear
    lr: 1.0e-3
    weight_decay: [1e-5]  # AdamW L2 regularization; 0 disables.
    batch_size: 64
    factor: 0.5 # Learning rate scheduler
    patience: 25
    min_lr: 1.0e-6
    drive_mean_power_weight: [1.0e-3]
    kurtosis_weight: [1.0e-1]     # stiffness of the pull toward kurtosis_target, not a force.
    kurtosis_target: [3.0]

                                  

ENCODER_DECODER_VALIDATION:
  CONSTELLATION: qpsk
  NOISE_FLOOR_POINTS: 20  # repeats of one fixed encoded symbol to estimate the additive
                           # noise floor per E/D; 0 disables the noise-floor plot